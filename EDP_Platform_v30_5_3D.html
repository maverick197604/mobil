const STORE_KEY = 'edp_v30_state';
function loadStore(){try{const r=window.localStorage&&window.localStorage.getItem(STORE_KEY);return r?JSON.parse(r):{};}catch(e){return{};}}
function saveStoreKey(k,v){try{if(!window.localStorage)return;const s=loadStore();s[k]=v;window.localStorage.setItem(STORE_KEY,JSON.stringify(s));}catch(e){}}
function usePersistedState(key,initial){const [val,setVal]=useState(()=>{const s=loadStore();return s[key]!==undefined?s[key]:initial;});useEffect(()=>{saveStoreKey(key,val);},[key,val]);return[val,setVal];}

═══════════════════════════════════════════════════════════════ */
const ToastCtx = createContext({push:()=>{}});
function ToastProvider({children}){
  const [toasts,setToasts]=useState([]);
  const push=useCallback((text,type='info')=>{const id=Date.now()+Math.random();setToasts(t=>[...t,{id,text,type}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3200);},[]);
  return(<ToastCtx.Provider value={{push}}>{children}
    <div style={{position:'fixed',right:18,bottom:18,zIndex:9000,display:'flex',flexDirection:'column',gap:8,pointerEvents:'none'}}>
      {toasts.map(t=>{const col=t.type==='error'?'#f87171':t.type==='success'?'#34d399':t.type==='warn'?'#fbbf24':'#818cf8';const bg=t.type==='error'?'rgba(239,68,68,.12)':t.type==='success'?'rgba(16,185,129,.12)':t.type==='warn'?'rgba(245,158,11,.12)':'rgba(99,102,241,.12)';return(
        <div key={t.id} className="toast-in glass" style={{padding:'10px 14px',borderRadius:10,border:'1px solid '+col+'66',background:bg,color:'#f8fafc',fontSize:12,fontWeight:600,minWidth:220,maxWidth:340,display:'flex',alignItems:'center',gap:10,boxShadow:'0 8px 32px rgba(0,0,0,.35)'}}><div style={{width:8,height:8,borderRadius:'50%',background:col,flexShrink:0}}/><span style={{lineHeight:1.4}}>{t.text}</span></div>);})}
    </div></ToastCtx.Provider>);
}
function useToast(){return useContext(ToastCtx);}

═══════════════════════════════════════════════════════════════ */
function Badge({status,text}){return <span style={{fontSize:9,fontWeight:800,padding:'2px 7px',borderRadius:4,background:SB[status],border:'1px solid '+SBBD[status],color:SC[status]}}>{text||status.toUpperCase()}</span>;}
function InfoRow({label,val,col}){return <div style={{display:'flex',justifyContent:'space-between',padding:'4px 0',borderBottom:'1px solid rgba(30,41,59,.4)'}}><span style={{fontSize:11,color:C.sub,marginRight:8}}>{label}</span><span style={{fontSize:11,fontWeight:600,color:col||C.tx,textAlign:'right'}}>{val}</span></div>;}
function useEscape(handler,active=true){useEffect(()=>{if(!active)return;const f=e=>{if(e.key==='Escape')handler();};window.addEventListener('keydown',f);return()=>window.removeEventListener('keydown',f);},[active,handler]);}
function Section({title,children,actions}){return(<div style={{marginBottom:24}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}><div style={{fontSize:10,fontWeight:900,color:C.sub,textTransform:'uppercase',letterSpacing:1}}>{title}</div>{actions}</div>{children}</div>);}

/* ═══════════════════════════════════════════════════════════════
   PROJECT WIZARD (Onboarding)
═══════════════════════════════════════════════════════════════ */
function ProjectWizard({onCreate, onCancel, existingProjects}){
  const [step,setStep]=useState(1);
  const [name,setName]=useState('');
  const [desc,setDesc]=useState('');
  const [roleId,setRoleId]=useState(null);
  const [selViews,setSelViews]=useState({});
  useEscape(()=>{ if(onCancel) onCancel(); }, !!onCancel);

  // Wenn Rolle gewählt → Default-Template laden
  useEffect(()=>{
    if(!roleId) return;
    const tmpl=ROLE_TEMPLATES[roleId]||{project:[],enterprise:[]};
    const s={};
    [...tmpl.project,...tmpl.enterprise].forEach(v=>{s[v]=true;});
    setSelViews(s);
  },[roleId]);

  const role=ROLES.find(r=>r.id===roleId);
  const availableProject=Object.values(VIEW_CATALOG).filter(v=>v.kind==='project');
  const availableEnterprise=Object.values(VIEW_CATALOG).filter(v=>v.kind==='enterprise');
  function toggleView(id){setSelViews(s=>({...s,[id]:!s[id]}));}
  function createProject(){
    if(!name.trim()||!roleId){return;}
    const views=Object.keys(selViews).filter(k=>selViews[k]);
    onCreate({id:'proj_'+Date.now(),name:name.trim(),desc:desc.trim(),roleId,views,created:new Date().toISOString(),
      // Projekt-eigene Bausteine (Skills, Agenten, Persons können hier ergänzt werden)
      ownSkills:[], ownAgents:[], ownPersons:[],
    });
  }

  return(
    <div style={{position:'fixed',inset:0,zIndex:200,background:'rgba(2,4,10,.85)',backdropFilter:'blur(8px)',display:'flex',alignItems:'center',justifyContent:'center',padding:30}}>
      <div className="scale-in glass" style={{width:'100%',maxWidth:920,maxHeight:'92vh',display:'flex',flexDirection:'column',borderRadius:18,border:'1px solid rgba(99,102,241,.25)',background:'linear-gradient(145deg,rgba(15,23,42,.95),rgba(5,8,15,.98))',boxShadow:'0 20px 80px rgba(0,0,0,.6)'}}>
        {/* Header */}
        <div style={{padding:'18px 24px',borderBottom:'1px solid rgba(30,41,59,.6)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontSize:9,fontWeight:800,color:'#818cf8',textTransform:'uppercase',letterSpacing:2,marginBottom:3}}>Schritt {step} von 3</div>
            <div style={{fontSize:18,fontWeight:900,color:C.tx}}>{step===1?'Neues Projekt anlegen':step===2?'Rolle wählen':'Sichten / Reiter zusammenstellen'}</div>
          </div>
          {onCancel && <button onClick={onCancel} className="btn-hover" style={{background:'none',border:'none',color:C.sub,cursor:'pointer',fontSize:22}}>×</button>}
        </div>

        {/* Stepper */}
        <div style={{display:'flex',gap:0,padding:'12px 24px',background:'rgba(15,23,42,.4)',borderBottom:'1px solid rgba(30,41,59,.5)'}}>
          {[1,2,3].map(s=>(
            <div key={s} style={{flex:1,height:4,marginRight:s<3?6:0,borderRadius:2,background:step>=s?'#6366f1':'#1e293b',transition:'background .2s'}}/>
          ))}
        </div>

        {/* Body */}
        <div className="sb fade" style={{flex:1,overflowY:'auto',padding:24}}>
          {step===1 && (
            <div style={{display:'flex',flexDirection:'column',gap:18,maxWidth:520,margin:'0 auto'}}>
              <div style={{textAlign:'center',marginBottom:8}}>
                <div style={{fontSize:32,marginBottom:8}}>🚀</div>
                <div style={{fontSize:13,color:C.sub,lineHeight:1.6}}>Lege ein neues Projekt an, in dem du Rollen, Sichten und KI-Agenten orchestrierst. Daten werden über MCP aus den verbundenen Systemen gezogen.</div>
              </div>
              <div>
                <label style={{display:'block',fontSize:10,fontWeight:800,color:C.sub,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>Projektname *</label>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="z. B. iQ700 Backofen Release V5" autoFocus style={{width:'100%',background:'#020408',border:'1px solid #1e293b',color:C.tx,fontSize:14,borderRadius:9,padding:'10px 14px',outline:'none'}}/>
              </div>
              <div>
                <label style={{display:'block',fontSize:10,fontWeight:800,color:C.sub,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>Beschreibung (optional)</label>
                <textarea value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Worum geht es in diesem Projekt?" style={{width:'100%',background:'#020408',border:'1px solid #1e293b',color:C.tx,fontSize:13,borderRadius:9,padding:'10px 14px',outline:'none',resize:'vertical',minHeight:80,fontFamily:'inherit',lineHeight:1.5}}/>
              </div>
              {existingProjects && existingProjects.length>0 && (
                <div style={{padding:'10px 14px',borderRadius:9,background:'rgba(99,102,241,.06)',border:'1px solid rgba(99,102,241,.18)',fontSize:11,color:'#94a3b8'}}>
                  <div style={{fontSize:9,fontWeight:800,color:'#818cf8',textTransform:'uppercase',marginBottom:4}}>Bestehende Projekte</div>
                  {existingProjects.slice(0,5).map(p=><div key={p.id} style={{fontSize:11,padding:'2px 0'}}>· {p.name} <span style={{color:C.sub}}>({ROLES.find(r=>r.id===p.roleId)?.label})</span></div>)}
                </div>
              )}
            </div>
          )}

          {step===2 && (
            <div>
              <div style={{textAlign:'center',marginBottom:18,color:C.sub,fontSize:12,lineHeight:1.6}}>Aus welcher Rolle heraus arbeitest du in <strong style={{color:C.tx}}>{name||'diesem Projekt'}</strong>? Die Rolle bestimmt das Standard-Template.</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:12}}>
                {ROLES.map(r=>{const sel=roleId===r.id;return(
                  <div key={r.id} onClick={()=>setRoleId(r.id)} className={'role-card'+(sel?' sel':'')}>
                    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                      <div style={{width:36,height:36,borderRadius:9,background:r.color+'1f',border:'1.5px solid '+r.color+'55',display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <i data-lucide={r.icon} style={{width:18,height:18,color:r.color}}></i>
                      </div>
                      <div>
                        <div style={{fontSize:13,fontWeight:800,color:C.tx,lineHeight:1.2}}>{r.label}</div>
                      </div>
                    </div>
                    <div style={{fontSize:10,color:C.sub,lineHeight:1.5}}>{r.desc}</div>
                    {sel && <div style={{position:'absolute',top:10,right:10,width:18,height:18,borderRadius:'50%',background:'#6366f1',display:'flex',alignItems:'center',justifyContent:'center'}}><svg width="10" height="10" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round"/></svg></div>}
                  </div>
                );})}
              </div>
            </div>
          )}

          {step===3 && role && (
            <div>
              <div style={{padding:'12px 16px',borderRadius:10,background:role.color+'12',border:'1px solid '+role.color+'40',marginBottom:18,display:'flex',alignItems:'center',gap:12}}>
                <div style={{width:34,height:34,borderRadius:8,background:role.color+'22',border:'1.5px solid '+role.color+'66',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <i data-lucide={role.icon} style={{width:16,height:16,color:role.color}}></i>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:800,color:C.tx}}>Standard-Template für {role.label}</div>
                  <div style={{fontSize:10,color:C.sub,marginTop:1}}>{Object.values(selViews).filter(Boolean).length} Reiter ausgewählt · jederzeit anpassbar</div>
                </div>
                <button onClick={()=>setRoleId(roleId)} className="btn-hover" style={{fontSize:10,fontWeight:700,padding:'5px 11px',borderRadius:6,background:'transparent',border:'1px solid '+role.color+'66',color:role.color,cursor:'pointer'}}>Reset</button>
              </div>

              <Section title="Projekt-Sichten (rollenspezifisch)" actions={<div style={{fontSize:9,color:C.sub}}>{availableProject.filter(v=>selViews[v.id]).length}/{availableProject.length}</div>}>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:8}}>
                  {availableProject.map(v=>{const on=!!selViews[v.id];return(
                    <div key={v.id} onClick={()=>toggleView(v.id)} className={'gc btn-hover'+(on?' tile-on':'')} style={{padding:'10px 12px',cursor:'pointer',display:'flex',alignItems:'center',gap:9,borderColor:on?'#6366f1':'rgba(255,255,255,.06)'}}>
                      <div style={{padding:6,borderRadius:6,background:on?'rgba(99,102,241,.2)':'rgba(30,41,59,.5)'}}><i data-lucide={v.icon} style={{width:13,height:13,color:on?'#818cf8':'#64748b'}}></i></div>
                      <div style={{flex:1,fontSize:11,fontWeight:600,color:on?C.tx:'#94a3b8'}}>{v.label}</div>
                      <div className="checkmark" style={{border:'1.5px solid '+(on?'#6366f1':'#475569'),background:on?'#6366f1':'transparent'}}>{on&&<svg width="10" height="10" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round"/></svg>}</div>
                    </div>
                  );})}
                </div>
              </Section>

              <Section title="Enterprise-Bausteine (unternehmensweit)" actions={<div style={{fontSize:9,color:C.sub}}>{availableEnterprise.filter(v=>selViews[v.id]).length}/{availableEnterprise.length}</div>}>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:8}}>
                  {availableEnterprise.map(v=>{const on=!!selViews[v.id];return(
                    <div key={v.id} onClick={()=>toggleView(v.id)} className={'gc btn-hover'+(on?' tile-on':'')} style={{padding:'10px 12px',cursor:'pointer',display:'flex',alignItems:'center',gap:9,borderColor:on?'#6366f1':'rgba(255,255,255,.06)'}}>
                      <div style={{padding:6,borderRadius:6,background:on?'rgba(99,102,241,.2)':'rgba(30,41,59,.5)'}}><i data-lucide={v.icon} style={{width:13,height:13,color:on?'#818cf8':'#64748b'}}></i></div>
                      <div style={{flex:1,fontSize:11,fontWeight:600,color:on?C.tx:'#94a3b8'}}>{v.label}</div>
                      <div className="checkmark" style={{border:'1.5px solid '+(on?'#6366f1':'#475569'),background:on?'#6366f1':'transparent'}}>{on&&<svg width="10" height="10" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round"/></svg>}</div>
                    </div>
                  );})}
                </div>
              </Section>

              <div style={{padding:'10px 14px',borderRadius:8,background:'rgba(99,102,241,.06)',border:'1px solid rgba(99,102,241,.2)',fontSize:11,color:'#a5b4fc',lineHeight:1.6,marginTop:10}}>
                <i data-lucide="info" style={{width:12,height:12,verticalAlign:-2,marginRight:6}}></i>
                Im Projekt kannst du jederzeit Reiter aktivieren oder deaktivieren. Skills, Agenten und digitale Personen aus Enterprise-Bausteinen werden zur Wiederverwendung übernommen.
              </div>
            </div>
          )}
        </div>

        {/* Footer */}
        <div style={{padding:'14px 24px',borderTop:'1px solid rgba(30,41,59,.6)',background:'rgba(15,23,42,.5)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontSize:10,color:C.sub}}>{step===1?'Name eingeben →':step===2?'Rolle auswählen →':'Sichten bestätigen'}</div>
          <div style={{display:'flex',gap:8}}>
            {step>1 && <button onClick={()=>setStep(s=>s-1)} className="btn-hover" style={{padding:'8px 16px',borderRadius:8,background:'transparent',border:'1px solid #334155',color:'#94a3b8',fontSize:12,fontWeight:700,cursor:'pointer'}}>← Zurück</button>}
            {step<3 && <button disabled={step===1?!name.trim():step===2?!roleId:false} onClick={()=>setStep(s=>s+1)} className="btn-hover" style={{padding:'8px 18px',borderRadius:8,background:(step===1?!name.trim():!roleId)?'#1e293b':'#4f46e5',border:'none',color:'#fff',fontSize:12,fontWeight:700,cursor:(step===1?!name.trim():!roleId)?'not-allowed':'pointer',opacity:(step===1?!name.trim():!roleId)?.5:1}}>Weiter →</button>}
            {step===3 && <button onClick={createProject} className="btn-hover" style={{padding:'8px 20px',borderRadius:8,background:'linear-gradient(135deg,#4f46e5,#7c3aed)',border:'none',color:'#fff',fontSize:12,fontWeight:800,cursor:'pointer',display:'flex',alignItems:'center',gap:6}}><i data-lucide="check" style={{width:14,height:14}}></i> Projekt anlegen</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   START / PROJECTS OVERVIEW SCREEN
═══════════════════════════════════════════════════════════════ */
function ProjectsHome({projects,onOpen,onNew,onDelete}){
  return(
    <div className="fade" style={{height:'100vh',width:'100%',display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <header className="glass" style={{height:66,padding:'0 28px',borderBottom:'1px solid rgba(30,41,59,.6)',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <div style={{width:40,height:40,background:'linear-gradient(135deg,#4f46e5,#2563eb)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 0 16px rgba(79,70,229,.3)'}}><i data-lucide="hexagon" style={{width:18,height:18,color:'#fff'}}></i></div>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{fontSize:18,fontWeight:900,background:'linear-gradient(to right,#818cf8,#60a5fa)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',letterSpacing:'-0.3px'}}>Enterprise Digital Platform</div>
              <span style={{fontSize:8,fontWeight:900,padding:'2px 6px',borderRadius:4,background:'rgba(99,102,241,.15)',border:'1px solid rgba(99,102,241,.3)',color:'#818cf8',letterSpacing:1}}>V29</span>
            </div>
            <div style={{fontSize:9,color:'#334155',fontFamily:'monospace',textTransform:'uppercase',letterSpacing:2}}>Project & Role-Based Orchestration</div>
          </div>
        </div>
        <button onClick={onNew} className="btn-hover" style={{padding:'9px 18px',borderRadius:9,background:'linear-gradient(135deg,#4f46e5,#7c3aed)',border:'none',color:'#fff',fontSize:12,fontWeight:800,cursor:'pointer',display:'flex',alignItems:'center',gap:7,boxShadow:'0 4px 16px rgba(99,102,241,.3)'}}>
          <i data-lucide="plus" style={{width:14,height:14}}></i> Neues Projekt
        </button>
      </header>

      <main className="sb" style={{flex:1,overflowY:'auto',padding:'30px 40px'}}>
        <div style={{maxWidth:1200,margin:'0 auto'}}>
          <div style={{marginBottom:24}}>
            <div style={{fontSize:24,fontWeight:900,color:C.tx,marginBottom:4}}>Projekte</div>
            <div style={{fontSize:13,color:C.sub}}>Wähle ein bestehendes Projekt oder lege ein neues an.</div>
          </div>

          {projects.length===0 ? (
            <div className="gc" style={{padding:60,textAlign:'center',borderStyle:'dashed'}}>
              <div style={{fontSize:48,marginBottom:14}}>📂</div>
              <div style={{fontSize:16,fontWeight:800,color:C.tx,marginBottom:6}}>Noch keine Projekte</div>
              <div style={{fontSize:12,color:C.sub,marginBottom:20,lineHeight:1.6,maxWidth:380,margin:'0 auto 20px'}}>Lege dein erstes Projekt an. Du wählst eine Rolle und stellst dir die gewünschten Sichten zusammen.</div>
              <button onClick={onNew} className="btn-hover" style={{padding:'10px 22px',borderRadius:9,background:'linear-gradient(135deg,#4f46e5,#7c3aed)',border:'none',color:'#fff',fontSize:12,fontWeight:800,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6}}>
                <i data-lucide="plus" style={{width:14,height:14}}></i> Erstes Projekt anlegen
              </button>
            </div>
          ) : (
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:14}}>
              {projects.map(p=>{const role=ROLES.find(r=>r.id===p.roleId);return(
                <div key={p.id} className="gc btn-hover" onClick={()=>onOpen(p.id)} style={{padding:18,cursor:'pointer',position:'relative'}}>
                  <button onClick={e=>{e.stopPropagation();if(window.confirm('Projekt "'+p.name+'" wirklich löschen?'))onDelete(p.id);}} style={{position:'absolute',top:10,right:10,background:'none',border:'none',color:'#334155',cursor:'pointer',padding:4,opacity:.6}} title="Löschen"><i data-lucide="trash-2" style={{width:13,height:13}}></i></button>
                  <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
                    <div style={{width:36,height:36,borderRadius:9,background:(role?.color||'#64748b')+'22',border:'1.5px solid '+(role?.color||'#64748b')+'55',display:'flex',alignItems:'center',justifyContent:'center'}}>
                      <i data-lucide={role?.icon||'folder'} style={{width:17,height:17,color:role?.color||'#94a3b8'}}></i>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:800,color:C.tx,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{p.name}</div>
                      <div style={{fontSize:9,color:role?.color||C.sub,textTransform:'uppercase',letterSpacing:1,fontWeight:700,marginTop:1}}>{role?.label||p.roleId}{p.client?<span style={{color:C.sub,marginLeft:6}}>· {p.client}</span>:null}</div>
                    </div>
                  </div>
                  {p.desc && <div style={{fontSize:11,color:C.sub,lineHeight:1.5,marginBottom:10,minHeight:33,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{p.desc}</div>}
                  <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>
                    {p.views.slice(0,4).map(v=>{const view=VIEW_CATALOG[v];return view?<span key={v} style={{fontSize:8,fontWeight:700,padding:'2px 6px',borderRadius:4,background:'rgba(99,102,241,.1)',border:'1px solid rgba(99,102,241,.2)',color:'#818cf8'}}>{view.label}</span>:null;})}
                    {p.views.length>4 && <span style={{fontSize:8,fontWeight:700,padding:'2px 6px',color:C.sub}}>+{p.views.length-4} weitere</span>}
                  </div>
                  <div style={{marginTop:10,paddingTop:10,borderTop:'1px solid rgba(30,41,59,.5)',fontSize:9,color:C.sub,display:'flex',justifyContent:'space-between'}}>
                    <span>{p.views.length} Reiter</span>
                    <span>{new Date(p.created).toLocaleDateString('de-DE')}</span>
                  </div>
                </div>
              );})}
            </div>
          )}
        </div>
      </main>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   MCP DATA INDICATOR (zeigt, woher Daten kommen)
═══════════════════════════════════════════════════════════════ */
function MCPBadge({systems}){
  if(!systems||!systems.length)return null;
  return(
    <div style={{display:'flex',alignItems:'center',gap:6,padding:'4px 10px',borderRadius:6,background:'rgba(99,102,241,.08)',border:'1px solid rgba(99,102,241,.2)',fontSize:9,color:'#a5b4fc'}}>
      <i data-lucide="plug" style={{width:10,height:10}}></i>
      <span style={{fontWeight:700}}>MCP:</span>
      <span style={{fontFamily:'monospace'}}>{systems.map(s=>{const sys=SYS.find(x=>x.id===s);return sys?sys.name:s;}).join(' · ')}</span>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   PROJECT VIEWS — Role-Specific Templates
═══════════════════════════════════════════════════════════════ */

// REQUIREMENTS (R&D / Offer Engineering)
function RequirementsView({project,addLog}){
  const [sel,setSel]=useState(null);
  useEscape(()=>setSel(null),!!sel);
  const reqs=RFLP.requirements.map(r=>({...r,priority:Math.random()>.5?'high':'medium',status:Math.random()>.7?'warn':'ok',source:Math.random()>.5?'Customer':'Internal'}));
  return(
    <div className="sli" style={{height:'100%',display:'flex',flexDirection:'column',padding:18,overflow:'hidden'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexShrink:0}}>
        <div>
          <div style={{fontSize:17,fontWeight:900,color:C.tx}}>Requirements</div>
          <div style={{fontSize:11,color:C.sub,marginTop:2}}>{reqs.length} Anforderungen · Quelle: Teamcenter + Salesforce</div>
        </div>
        <MCPBadge systems={['sys_tc','sys_sfd']}/>
      </div>
      <div className="sb" style={{flex:1,overflowY:'auto',display:'flex',gap:14,paddingBottom:20}}>
        <div style={{flex:1,display:'flex',flexDirection:'column',gap:8}}>
          {reqs.map(r=>{const isS=sel?.id===r.id;return(
            <div key={r.id} onClick={()=>setSel(r)} className="gc btn-hover" style={{padding:14,cursor:'pointer',borderColor:isS?'#818cf8':'rgba(255,255,255,.08)',borderLeft:'3px solid '+(r.priority==='high'?'#f87171':'#fbbf24')}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:5}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:9,fontWeight:800,color:'#818cf8',fontFamily:'monospace',background:'rgba(99,102,241,.12)',padding:'2px 6px',borderRadius:3}}>{r.id.toUpperCase()}</span>
                  <Badge status={r.status} text={r.priority==='high'?'HIGH':'MED'}/>
                  <span style={{fontSize:9,color:C.sub}}>{r.source}</span>
                </div>
                <i data-lucide="chevron-right" style={{width:14,height:14,color:'#475569'}}></i>

// RFLP-STRUKTUR (R&D)
function RFLPView({project,addLog}){
  const [sel,setSel]=useState(null);
  const [hover,setHover]=useState(null);
  useEscape(()=>setSel(null),!!sel);
  const allNodes=[...RFLP.requirements,...RFLP.functions,...RFLP.logic,...RFLP.physical];
  const LIK={requirements:'req',functions:'fn',logic:'lg',physical:'ph'};
  function layerIdx(id){if(id.startsWith('req'))return 0;if(id.startsWith('fn'))return 1;if(id.startsWith('lg'))return 2;if(id.startsWith('ph'))return 3;return -1;}
  function getConnected(id){const s=new Set([id]);RFLP.edges.forEach(e=>{if(e.from===id)s.add(e.to);if(e.to===id)s.add(e.from);});return s;}
  const activeId=hover||sel;const connected=activeId?getConnected(activeId):new Set();
  const VW=2000,BH=160,BG=50;const TH=4*BH+3*BG+60;const NW=235,NH=62,PAD=170;
  const pos={};
  LAYERS.forEach((layer,li)=>{const nodes=RFLP[layer.key];const bandY=30+li*(BH+BG);const avail=VW-PAD-60;const step=Math.min(avail/nodes.length,310);const startX=PAD+(avail-step*nodes.length)/2+step/2-NW/2;nodes.forEach((n,ni)=>{const x=startX+ni*step;const y=bandY+(BH-NH)/2;pos[n.id]={x,y,cx:x+NW/2,cy:bandY+BH/2,bandY,color:layer.color,li};});});
  return(
    <div className="sli" style={{height:'100%',display:'flex',flexDirection:'column',padding:18,overflow:'hidden'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexShrink:0}}>
        <div>
          <div style={{fontSize:17,fontWeight:900,background:'linear-gradient(to right,#818cf8,#38bdf8)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>RFLP — Requirements · Functions · Logic · Physical</div>
          <div style={{fontSize:11,color:C.sub,marginTop:2}}>4 Ebenen · klicke einen Knoten für Details</div>
        </div>
        <div style={{display:'flex',gap:14,alignItems:'center'}}>
          {LAYERS.map(l=><div key={l.key} style={{display:'flex',alignItems:'center',gap:5}}><div style={{width:9,height:9,borderRadius:3,background:l.color}}/><span style={{fontSize:10,fontWeight:700,color:l.color,textTransform:'uppercase'}}>{l.label}</span></div>)}
          <MCPBadge systems={['sys_tc']}/>
        </div>
      </div>
      <div style={{flex:1,display:'flex',minHeight:0,gap:14}}>
        <div style={{flex:1,minHeight:0,position:'relative',overflow:'hidden',border:C.bd,borderRadius:12,background:'rgba(3,5,12,.6)'}}>
          <svg viewBox={'0 0 '+VW+' '+TH} width="100%" height="100%" preserveAspectRatio="xMidYMid meet" onClick={()=>setSel(null)} style={{cursor:'default'}}>
            <defs>{LAYERS.map((l,i)=><marker key={i} id={'mk'+i} markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill={l.color} opacity=".7"/></marker>)}</defs>
            {LAYERS.map((ld,li)=>{const bandY=30+li*(BH+BG);return(<g key={ld.key}><rect x="0" y={bandY} width={VW} height={BH} fill={ld.bg} stroke={ld.border} strokeWidth="1"/><rect x="10" y={bandY+BH/2-22} width={PAD-22} height="44" rx="9" fill="rgba(6,9,17,.88)" stroke={ld.color} strokeWidth="1.5"/><text x="30" y={bandY+BH/2+6} fontSize="13" fontWeight="800" fill={ld.color} fontFamily="Inter,sans-serif" letterSpacing="0.5">{ld.label.toUpperCase()}</text>
              {RFLP[ld.key].map(node=>{const p=pos[node.id];if(!p)return null;const isSel=sel===node.id;const isHov=hover===node.id;const isConn=activeId&&connected.has(node.id);const isDim=activeId&&!isConn;return(<g key={node.id} onMouseEnter={()=>setHover(node.id)} onMouseLeave={()=>setHover(null)} onClick={e=>{e.stopPropagation();setSel(sel===node.id?null:node.id);}} style={{cursor:'pointer',opacity:isDim?.15:1,transition:'opacity .15s'}}><rect x={p.x} y={p.y} width={NW} height={NH} rx="10" fill={isSel?ld.color:isHov?'rgba(30,41,59,.95)':'rgba(6,9,17,.9)'} fillOpacity={isSel?.85:1} stroke={ld.color} strokeWidth={isSel?3:isHov?2:1.5}/>{node.risk&&<circle cx={p.x+NW-14} cy={p.y+14} r="6" fill="#f59e0b"/>}<text x={p.x+14} y={p.y+NH/2-3} fontSize="14" fontWeight="800" fill={isSel?'#fff':'#e2e8f0'}>{node.label.length>22?node.label.slice(0,21)+'…':node.label}</text><text x={p.x+14} y={p.y+NH/2+14} fontSize="10" fill={isSel?'rgba(255,255,255,.7)':'#64748b'}>{(node.desc||'').slice(0,32)}</text></g>);})}
            </g>);})}
            {RFLP.edges.map((e,i)=>{const fp=pos[e.from],tp=pos[e.to];if(!fp||!tp)return null;const isActive=activeId&&connected.has(e.from)&&connected.has(e.to);const op=activeId?(isActive?.85:.05):.22;const x1=fp.cx,y1=fp.bandY+BH,x2=tp.cx,y2=tp.bandY;const midY=(y1+y2)/2;return <path key={i} d={'M'+x1+','+y1+' C'+x1+','+midY+' '+x2+','+midY+' '+x2+','+y2} stroke={LAYERS[fp.li].color} strokeWidth={isActive?3:1} fill="none" opacity={op} markerEnd={'url(#mk'+fp.li+')'}/>;})}
          </svg>
        </div>
        {sel && (()=>{const node=allNodes.find(n=>n.id===sel);const li=layerIdx(sel);const layer=li>=0?LAYERS[li]:null;if(!node||!layer)return null;return(
          <div className="gc scale-in" style={{width:300,padding:18,alignSelf:'flex-start',maxHeight:'100%',overflowY:'auto'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <div style={{fontSize:9,fontWeight:800,color:layer.color,textTransform:'uppercase',letterSpacing:1}}>{layer.label}</div>
              <button onClick={()=>setSel(null)} style={{background:'none',border:'none',color:C.sub,cursor:'pointer',fontSize:18}}>×</button>
            </div>
            <div style={{fontSize:15,fontWeight:800,color:C.tx,marginBottom:6}}>{node.label}</div>
            <div style={{fontSize:11,color:C.sub,marginBottom:12}}>{node.desc}</div>
            {node.params && node.params.map(p=><InfoRow key={p.name} label={p.name} val={p.val+' '+(p.min?'('+p.min+'–'+p.max+')':'')}/>)}
            {node.cost && <InfoRow label="Kosten" val={node.cost} col="#fbbf24"/>}
            {node.location && <InfoRow label="Quelle" val={node.location}/>}
            {node.risk && <div style={{marginTop:10,padding:'8px 10px',borderRadius:7,background:'rgba(245,158,11,.1)',border:'1px solid rgba(245,158,11,.3)',color:'#fbbf24',fontSize:11}}>⚠ Risiko: Single Source</div>}
            <button onClick={()=>addLog('KI-Tradeoff für "'+node.label+'" gestartet','success')} className="btn-hover" style={{width:'100%',marginTop:14,padding:'8px',borderRadius:7,background:'linear-gradient(to right,'+layer.color+'cc,'+layer.color+'88)',border:'none',color:'#fff',fontSize:11,fontWeight:800,cursor:'pointer'}}>⚖ Tradeoff analysieren</button>
          </div>
        );})()}
      </div>
    </div>
  );
}

function WashingMachine3D({canvasRef}){
  useEffect(()=>{
    if(!canvasRef.current||!window.THREE)return;
    const T=window.THREE;
    const cv=canvasRef.current, par=cv.parentElement;
    const W=par.clientWidth||500, H=par.clientHeight||380;
    const renderer=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:false});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setClearColor(0x03050a,1);
    renderer.shadowMap.enabled=true;
    renderer.setSize(W,H);
    const scene=new T.Scene();
    const cam=new T.PerspectiveCamera(42,W/H,0.05,50);
    cam.position.set(1.1,0.85,1.8);
    // Lights
    scene.add(new T.AmbientLight(0xffffff,0.55));
    const sun=new T.DirectionalLight(0xffffff,0.9); sun.position.set(3,5,3); sun.castShadow=true; scene.add(sun);
    const rim=new T.DirectionalLight(0x4488ff,0.35); rim.position.set(-3,0,-2); scene.add(rim);
    const fill=new T.DirectionalLight(0xffeedd,0.2); fill.position.set(0,2,-3); scene.add(fill);
    // Controls
    const ctrl=new T.OrbitControls(cam,renderer.domElement);
    ctrl.enableDamping=true; ctrl.dampingFactor=0.08;
    ctrl.target.set(0,0.45,0); ctrl.minDistance=0.8; ctrl.maxDistance=5; ctrl.update();
    // Materials
    const mW=new T.MeshPhongMaterial({color:0xf2f2f4,shininess:90});
    const mG=new T.MeshPhongMaterial({color:0x4a5568,shininess:50});
    const mDk=new T.MeshPhongMaterial({color:0x1a202c,shininess:20});
    const mSt=new T.MeshPhongMaterial({color:0x8fa5b8,shininess:150});
    const mGl=new T.MeshPhongMaterial({color:0x90caf9,transparent:true,opacity:0.32,shininess:250,side:T.DoubleSide});
    const mB=new T.MeshPhongMaterial({color:0x3b82f6,shininess:120,emissive:0x1a3a7a,emissiveIntensity:0.3});
    const mRub=new T.MeshPhongMaterial({color:0x181825,shininess:8});
    const mLed=new T.MeshPhongMaterial({color:0x34d399,emissive:0x34d399,emissiveIntensity:0.8,shininess:40});
    // ── Body ──
    const grp=new T.Group();
    const bdy=new T.Mesh(new T.BoxGeometry(0.6,0.85,0.56),mW); bdy.position.set(0,0.425,0); bdy.castShadow=true; bdy.receiveShadow=true; grp.add(bdy);
    // Top panel
    const top=new T.Mesh(new T.BoxGeometry(0.6,0.09,0.56),mG); top.position.set(0,0.895,0); grp.add(top);
    // Control display area
    const disp=new T.Mesh(new T.BoxGeometry(0.28,0.055,0.01),mDk); disp.position.set(-0.03,0.9,0.282); grp.add(disp);
    // LED stripe on display
    const led=new T.Mesh(new T.BoxGeometry(0.22,0.006,0.005),mLed); led.position.set(-0.03,0.91,0.284); grp.add(led);
    // Program dial
    const dial=new T.Mesh(new T.CylinderGeometry(0.038,0.038,0.012,24),mB); dial.rotation.x=Math.PI/2; dial.position.set(0.2,0.895,0.284); grp.add(dial);
    const dMrk=new T.Mesh(new T.BoxGeometry(0.004,0.028,0.004),new T.MeshPhongMaterial({color:0xffffff})); dMrk.position.set(0.2,0.895+0.025,0.284); grp.add(dMrk);
    // Detergent drawer
    const drw=new T.Mesh(new T.BoxGeometry(0.16,0.045,0.09),mG); drw.position.set(0.18,0.8,0.284); grp.add(drw);
    const drwH=new T.Mesh(new T.BoxGeometry(0.16,0.01,0.005),mB); drwH.position.set(0.18,0.795,0.288); grp.add(drwH);
    // ── Door system ──
    const rubGeo=new T.TorusGeometry(0.19,0.022,18,48); const rub=new T.Mesh(rubGeo,mRub); rub.rotation.x=Math.PI/2; rub.position.set(0,0.45,0.28); grp.add(rub);
    // Door outer ring (chrome)
    const dRingGeo=new T.TorusGeometry(0.195,0.012,12,48); const dRing=new T.Mesh(dRingGeo,mSt); dRing.rotation.x=Math.PI/2; dRing.position.set(0,0.45,0.282); grp.add(dRing);
    // Door glass
    const gl=new T.Mesh(new T.CircleGeometry(0.175,48),mGl); gl.position.set(0,0.45,0.284); grp.add(gl);
    // Door handle
    const hndl=new T.Mesh(new T.CylinderGeometry(0.012,0.012,0.12,12),mSt); hndl.rotation.z=Math.PI/2; hndl.position.set(0.19,0.45,0.29); grp.add(hndl);
    // ── Drum (inside, visible through glass) ──
    const drum=new T.Mesh(new T.CylinderGeometry(0.155,0.155,0.32,36),mSt); drum.rotation.x=Math.PI/2; drum.position.set(0,0.45,0.1); grp.add(drum);
    // Drum baffles
    for(let i=0;i<3;i++){
      const a=(i/3)*Math.PI*2;
      const bf=new T.Mesh(new T.BoxGeometry(0.022,0.28,0.018),mG);
      bf.rotation.x=Math.PI/2; bf.rotation.z=a;
      bf.position.set(Math.cos(a)*0.1,0.45+Math.sin(a)*0.1,0.12); grp.add(bf);
    }
    // Drum holes (simplified circles as small discs)
    for(let r=0;r<3;r++) for(let c=0;c<8;c++){
      const a=(c/8)*Math.PI*2, rad=0.06+r*0.04;
      const h=new T.Mesh(new T.CircleGeometry(0.008,8),mDk);
      h.position.set(Math.cos(a)*rad,0.45+Math.sin(a)*rad,0.265); grp.add(h);
    }
    // ── Bottom detail ──
    const bot=new T.Mesh(new T.BoxGeometry(0.6,0.04,0.56),mG); bot.position.set(0,0.02,0); grp.add(bot);
    // Filter cap
    const flt=new T.Mesh(new T.CylinderGeometry(0.025,0.025,0.005,12),mB); flt.rotation.x=Math.PI/2; flt.position.set(-0.2,-0.005,0.282); grp.add(flt);
    // Feet
    [[-0.23,-0.24],[0.23,-0.24],[-0.23,0.24],[0.23,0.24]].forEach(([x,z])=>{
      const f=new T.Mesh(new T.CylinderGeometry(0.022,0.026,0.038,10),mRub); f.position.set(x,-0.019,z); grp.add(f);
    });
    // Power light
    const pw=new T.Mesh(new T.CircleGeometry(0.007,8),mLed); pw.position.set(0.25,0.895,0.284); grp.add(pw);
    scene.add(grp);
    // Floor grid
    const grid=new T.GridHelper(3,30,0x1e293b,0x0d1117); scene.add(grid);
    // Slow rotation animation
    let running=true, t=0;
    const ro=new ResizeObserver(()=>{
      if(!par)return;
      const w=par.clientWidth,h=par.clientHeight;
      renderer.setSize(w,h); cam.aspect=w/h; cam.updateProjectionMatrix();
    }); ro.observe(par);
    const loop=()=>{
      if(!running)return;
      requestAnimationFrame(loop);
      t+=0.003; grp.rotation.y=Math.sin(t)*0.18;
      ctrl.update(); renderer.render(scene,cam);
    }; loop();
    return()=>{ running=false; ro.disconnect(); renderer.dispose(); };
  },[]);
  return null;
}

      id:`BSH-WM-${gid.slice(0,3).toUpperCase()}-${String(seq).padStart(4,'0')}`,

/* ─── Digital Twin View ──────────────────────────────────────────────────── */
function DigitalTwinView({project,addLog}){
  const product=PRODUCTS[0];
  const canvasRef=useRef(null);
  const ovContRef=useRef(null);
  const ovInstanceRef=useRef(null);
  const fileInputRef=useRef(null);
  const [cadFile,setCadFile]=useState(null);
  const [selGrp,setSelGrp]=useState(null);
  const [selPart,setSelPart]=useState(null);
  const [search,setSearch]=useState('');
  const [page,setPage]=useState(0);
  const PAGE=50;

  const grpParts=useMemo(()=>selGrp?buildGroupParts(selGrp):[],[selGrp]);
  const filtered=useMemo(()=>{if(!search.trim())return grpParts;const q=search.toLowerCase();return grpParts.filter(p=>p.name.toLowerCase().includes(q)||p.id.toLowerCase().includes(q));},[grpParts,search]);
  const pageItems=filtered.slice(page*PAGE,(page+1)*PAGE);
  const pages=Math.ceil(filtered.length/PAGE);

  const partDetail=useMemo(()=>selPart?grpParts.find(p=>p.id===selPart):null,[selPart,grpParts]);

  useEffect(()=>{setPage(0);setSelPart(null);},[selGrp,search]);

  useEffect(()=>{
    if(!cadFile||!ovContRef.current)return;
    const OV=window.OV;
    if(!OV){alert('Online3DViewer nicht geladen.');return;}
    if(ovInstanceRef.current&&ovInstanceRef.current.Destroy){ovInstanceRef.current.Destroy();ovInstanceRef.current=null;}
    const viewer=new OV.EmbedViewer(ovContRef.current);
    viewer.LoadModelFromFileList([cadFile]);
    ovInstanceRef.current=viewer;
    return()=>{if(ovInstanceRef.current&&ovInstanceRef.current.Destroy){ovInstanceRef.current.Destroy();ovInstanceRef.current=null;}};
  },[cadFile]);

  function handleFileChange(e){const f=e.target.files&&e.target.files[0];if(f)setCadFile(f);e.target.value='';}
  function resetViewer(){if(ovInstanceRef.current&&ovInstanceRef.current.Destroy){ovInstanceRef.current.Destroy();ovInstanceRef.current=null;}setCadFile(null);}

  const curMeta=PART_GROUPS_META.find(g=>g.id===selGrp);
  const stageCol={'Freigegeben':'#34d399','In Qualifizierung':'#fbbf24','Bemusterung':'#60a5fa','In Entwicklung':'#f87171','Konzept':'#94a3b8'};

  return(
  <GenericView title="Digital Twin · 3D" subtitle={product.brand+' '+product.name+' · '+product.release} icon="cpu" systems={['sys_tc','sys_sap','sys_nex']}>
    {/* Stats bar */}
    <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
      {[
        [`${TOTAL_PARTS.toLocaleString('de')} Bauteile`,'cpu','#60a5fa'],
        [`${TOTAL_COST.toFixed(0)} EUR gesamt`,'euro','#fbbf24'],
        [`${PART_GROUPS_META.length} Baugruppen`,'layers','#34d399'],
        [product.devStatus,'check-circle','#4ade80'],
      ].map(([v,icon,col])=>(
        <div key={v} style={{display:'flex',alignItems:'center',gap:5,background:'rgba(15,23,42,.7)',border:`1px solid ${col}22`,borderRadius:7,padding:'4px 10px',flex:'1 0 auto'}}>
          <i data-lucide={icon} style={{width:11,height:11,color:col}}></i>
          <span style={{fontSize:10,fontWeight:700,color:col}}>{v}</span>
        </div>
      ))}
    </div>
    <div style={{display:'flex',gap:10,height:'calc(100% - 40px)',minHeight:380}}>

      {/* ── Baugruppen-Baum (links) ── */}
      <div style={{flex:'0 0 22%',display:'flex',flexDirection:'column',gap:0,minWidth:0}}>
        <div style={{fontSize:8,fontWeight:900,color:C.sub,textTransform:'uppercase',letterSpacing:1,padding:'0 0 6px 2px'}}>Baugruppen-Baum</div>
        <div className="sb" style={{overflowY:'auto',flex:1}}>
          {PART_GROUPS_META.map(g=>(
            <div key={g.id}>
              <div onClick={()=>{setSelGrp(selGrp===g.id?null:g.id);setSearch('');}}
                style={{display:'flex',alignItems:'center',gap:6,padding:'7px 8px',borderRadius:7,cursor:'pointer',marginBottom:2,
                  background:selGrp===g.id?`${g.col}18`:'rgba(15,23,42,.4)',
                  border:`1px solid ${selGrp===g.id?g.col+'44':'#1e293b'}`,
                  transition:'all .12s'}}>
                <div style={{width:8,height:8,borderRadius:2,background:g.col,flexShrink:0}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:10,fontWeight:700,color:selGrp===g.id?g.col:C.tx,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{g.name}</div>
                  <div style={{fontSize:8,color:C.sub}}>{g.count.toLocaleString('de')} Teile · {g.totalCost.toFixed(0)} EUR</div>
                </div>
                <div style={{fontSize:9,color:selGrp===g.id?g.col:C.sub}}>{selGrp===g.id?'▾':'▸'}</div>
              </div>
              {/* Parts list for selected group */}
              {selGrp===g.id&&<div style={{marginBottom:6,paddingLeft:4}}>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Suche Teil..." style={{width:'100%',background:'#020408',border:'1px solid #1e293b',color:C.tx,fontSize:9,borderRadius:5,padding:'4px 7px',outline:'none',marginBottom:4}}/>
                <div style={{fontSize:8,color:C.sub,marginBottom:3,padding:'0 2px'}}>{filtered.length.toLocaleString('de')} Treffer{pages>1?` · Seite ${page+1}/${pages}`:''}</div>
                <div className="sb" style={{maxHeight:200,overflowY:'auto'}}>
                  {pageItems.map(p=>(
                    <div key={p.id} onClick={()=>setSelPart(selPart===p.id?null:p.id)}
                      style={{padding:'4px 6px',borderRadius:5,cursor:'pointer',marginBottom:1,
                        background:selPart===p.id?`${g.col}20`:'rgba(5,8,15,.6)',
                        border:`1px solid ${selPart===p.id?g.col+'55':'transparent'}`,
                        transition:'all .1s'}}>
                      <div style={{fontSize:9,fontWeight:600,color:selPart===p.id?g.col:C.tx,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{p.name}</div>
                      <div style={{fontSize:7,color:C.sub,fontFamily:'monospace'}}>{p.id}</div>
                    </div>
                  ))}
                </div>
                {pages>1&&<div style={{display:'flex',gap:4,marginTop:4}}>
                  <button disabled={page===0} onClick={()=>setPage(p=>p-1)} style={{flex:1,padding:'3px 0',fontSize:9,background:'rgba(30,41,59,.8)',border:'1px solid #1e293b',color:C.sub,borderRadius:4,cursor:page===0?'not-allowed':'pointer'}}>◀</button>
                  <button disabled={page>=pages-1} onClick={()=>setPage(p=>p+1)} style={{flex:1,padding:'3px 0',fontSize:9,background:'rgba(30,41,59,.8)',border:'1px solid #1e293b',color:C.sub,borderRadius:4,cursor:page>=pages-1?'not-allowed':'pointer'}}>▶</button>
                </div>}
              </div>}
            </div>
          ))}
        </div>
      </div>

      {/* ── 3D Viewer (mitte) ── */}
      <div className="gc" style={{flex:'0 0 48%',position:'relative',background:'#03050a',borderRadius:14,overflow:'hidden',minHeight:320}}>
        <canvas ref={canvasRef} style={{display:cadFile?'none':'block',width:'100%',height:'100%',position:'absolute',inset:0}}/>
        {!cadFile&&<WashingMachine3D canvasRef={canvasRef}/>}
        <div ref={ovContRef} style={{display:cadFile?'block':'none',width:'100%',height:'100%',position:'absolute',inset:0}}/>
        {!cadFile&&<>
          <div style={{position:'absolute',top:8,left:10,pointerEvents:'none'}}>
            <div style={{fontSize:7,fontWeight:900,color:'#334155',textTransform:'uppercase',letterSpacing:1.5}}>Live 3D · Orbit mit Maus</div>
          </div>
          <div style={{position:'absolute',bottom:42,left:10,display:'flex',gap:6,pointerEvents:'none'}}>
            {[['Kapazität',product.specs.capacity],['Drehzahl',product.specs.rpm],['Energie',product.specs.energy]].map(([k,v])=>(
              <div key={k} style={{background:'rgba(5,8,15,.7)',border:'1px solid #1e293b',borderRadius:6,padding:'3px 7px'}}>
                <div style={{fontSize:7,color:'#475569',textTransform:'uppercase'}}>{k}</div>
                <div style={{fontSize:10,fontWeight:800,color:'#e2e8f0'}}>{v}</div>

          </div>
        </>}
        {cadFile&&<div style={{position:'absolute',top:8,left:10,background:'rgba(5,8,15,.85)',border:'1px solid #1e3a5f',borderRadius:6,padding:'3px 8px',pointerEvents:'none'}}>
          <div style={{fontSize:8,color:'#60a5fa',fontWeight:700}}>📐 {cadFile.name}</div>
        </div>}
        {selGrp&&!cadFile&&<div style={{position:'absolute',top:8,left:'50%',transform:'translateX(-50%)',background:`${curMeta.col}22`,border:`1px solid ${curMeta.col}44`,borderRadius:6,padding:'3px 9px',pointerEvents:'none'}}>
          <div style={{fontSize:8,fontWeight:800,color:curMeta.col}}>{curMeta.name} · {curMeta.count.toLocaleString('de')} Teile</div>
        </div>}
        <div style={{position:'absolute',top:8,right:10,background:'rgba(16,185,129,.12)',border:'1px solid rgba(16,185,129,.3)',borderRadius:5,padding:'2px 7px',fontSize:8,fontWeight:800,color:'#34d399',pointerEvents:'none'}}>{product.devStatus}</div>
        <div style={{position:'absolute',bottom:8,right:8,display:'flex',gap:5,alignItems:'center'}}>
          {cadFile&&<button onClick={resetViewer} style={{padding:'4px 9px',background:'rgba(15,23,42,.9)',border:'1px solid #334155',borderRadius:5,color:'#94a3b8',fontSize:9,fontWeight:700,cursor:'pointer'}}>← 3D Modell</button>}

            📂 STEP / STL
          </button>
          <input ref={fileInputRef} type="file" accept=".step,.stp,.stl,.igs,.iges,.obj" style={{display:'none'}} onChange={handleFileChange}/>
        </div>
      </div>

      {/* ── Attribut-Panel (rechts) ── */}
      <div style={{flex:1,display:'flex',flexDirection:'column',gap:6,minWidth:0}}>

                  </div>
                  <div style={{height:3,background:'#0f172a',borderRadius:2,marginTop:5}}>
                    <div style={{height:'100%',width:(g.count/TOTAL_PARTS*100)+'%',background:`linear-gradient(90deg,${g.col}aa,${g.col})`,borderRadius:2}}/>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',marginTop:3}}>
                    <span style={{fontSize:7,color:C.sub}}>{g.count.toLocaleString('de')} Teile</span>
                    <span style={{fontSize:7,color:g.col}}>{(g.count/TOTAL_PARTS*100).toFixed(1)}%</span>
                  </div>
                </div>
              ))}
            </div>
          </>
        )}
      </div>
    </div>
  </GenericView>
);}

          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Suche..." style={{width:'100%',background:'#020408',border:'1px solid #1e293b',color:C.tx,fontSize:10,borderRadius:6,padding:'5px 8px 5px 24px',outline:'none'}}/>
        </div>

            <div key={a.id} onClick={()=>{setSelId(a.id);setMode('view');}} style={{padding:'9px 11px',borderRadius:9,cursor:'pointer',border:'1px solid '+(isA?'#6366f1':'#1e293b'),background:isA?'rgba(99,102,241,.08)':'rgba(30,41,59,.2)'}}>

    {from:'sales',      to:'aftersales', label:'Service-Plan', sev:'ok'},
    {from:'aftersales', to:'rd',         label:'Feldfehler-Loop', sev:'crit'},

          <defs>
            <marker id="arr_ok"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
            <marker id="arr_warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
            <marker id="arr_crit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
          </defs>
          {/* Phasen-Boxen */}
          {phases.map((p,i)=>(
            <g key={p.id}>
              <rect x={p.x-58} y={140} width={116} height={56} rx={9} fill="rgba(15,23,42,.85)" stroke={p.col} strokeWidth="1.5"/>

          })}
          {/* Feldfehler-Loop (aftersales → rd) */}
          {(()=>{const f=flows.find(x=>x.from==='aftersales'); const x1=phaseX('aftersales'), x2=phaseX('rd');

          {/* Cross-funktionale Agenten unten */}
          <text x="520" y="260" textAnchor="middle" fill="#64748b" fontSize="9" fontWeight="700" textTransform="uppercase">QUER-FUNKTIONEN — wirken auf alle Phasen</text>
          {crossAgents.map((c,i)=>{const x=140+i*160; return(
            <g key={c.id}>
              <circle cx={x} cy={c.y+30} r="22" fill="rgba(15,23,42,.85)" stroke={c.col} strokeWidth="1.5"/>
              <text x={x} y={c.y+30} textAnchor="middle" fill={c.col} fontSize="9" fontWeight="800">{c.label.slice(0,4).toUpperCase()}</text>
              <text x={x} y={c.y+62} textAnchor="middle" fill="#94a3b8" fontSize="8">{c.label}</text>
              {/* Verbindung zu allen Phasen — dezent */}
              {phases.map((p,pi)=>(<line key={pi} x1={x} y1={c.y+7} x2={p.x} y2={196} stroke={c.col} strokeWidth="0.4" opacity="0.18"/>))}
            </g>
          );})}
        </svg>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}}>
        <div className="gc" style={{padding:14}}>
          <div style={{fontSize:9,fontWeight:800,color:'#a5b4fc',textTransform:'uppercase',letterSpacing:1,marginBottom:10}}>Live-Aktivität · Top 5 Flows (last 1h)</div>
          {flows.slice(0,5).map((f,i)=>(<div key={i} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid rgba(30,41,59,.5)',fontSize:11}}>
            <span style={{color:'#cbd5e1'}}>{phases.find(p=>p.id===f.from)?.label} <span style={{color:C.sub}}>→</span> {phases.find(p=>p.id===f.to)?.label}</span>
            <span style={{color:f.sev==='ok'?'#86efac':f.sev==='warn'?'#fcd34d':'#fca5a5',fontWeight:700,fontFamily:'monospace'}}>{f.label}</span>
          </div>))}
        </div>
        <div className="gc" style={{padding:14}}>
          <div style={{fontSize:9,fontWeight:800,color:'#fbbf24',textTransform:'uppercase',letterSpacing:1,marginBottom:10}}>Aktive Trigger-Kaskaden</div>
          {TRIGGER_CASCADES.map(t=>(<div key={t.id} style={{padding:'8px 0',borderBottom:'1px solid rgba(30,41,59,.5)'}}>
            <div style={{fontSize:11,fontWeight:700,color:'#cbd5e1',marginBottom:2}}>{t.name}</div>
            <div style={{fontSize:9,color:C.sub}}>{t.reactions.length} Reaktionen · Trigger: {phases.find(p=>p.id===t.sourcePhase)?.label || t.sourcePhase}</div>
          </div>))}
        </div>
      </div>
    </div>
  );
}

                </div>
              ) : (
                <div style={{fontSize:9,color:C.sub,lineHeight:1.6}}>
                  Protocol: <span style={{color:'#cbd5e1',fontFamily:'monospace'}}>{d.protocol}</span> · Vendor: {d.vendor}<br/>
                  Status: <span style={{color:d.status==='online'?'#86efac':d.status==='syncing'?'#fcd34d':'#fca5a5',fontWeight:700}}>{d.status}</span> · {d.readWrite==='rw'?'Read/Write':'Read-only'} · {d.records}
                </div>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

            <div style={{fontSize:9,fontWeight:800,color:C.sub,textTransform:'uppercase',letterSpacing:1,marginBottom:8}}>Reaktions-Kaskade · {sel.reactions.length} Agenten reagieren</div>

/* ═══════════════════════════════════════════════════════════════
   EAE v30 · SKILL-CREATOR + HARNESS LIVE-TEST
═══════════════════════════════════════════════════════════════ */
function SkillCreatorView({project, addLog}){
  const [name,setName]=useState('CO₂-Steuer-Check');
  const [desc,setDesc]=useState('Berechnet die CO₂-Border-Adjustment-Mechanism-Abgabe (CBAM) für Stahlimporte.');
  const [phase,setPhase]=useState('cross');
  const [risk,setRisk]=useState('medium');
  const [trust,setTrust]=useState('T1');
  const [running,setRunning]=useState(false);
  const [results,setResults]=useState(null);
  const harnessChecks=[
    {id:'fn',  name:'Funktionale Validierung', desc:'Unit-Tests gegen Schema, Edge Cases (Negativwerte, Null-Daten).'},
    {id:'cp',  name:'Compliance-Check',         desc:'Konflikt mit geladenen Policies (KI-001/002/003), Trust-Tier-Limit.'},
    {id:'sc',  name:'Security-Check',           desc:'Prompt-Injection-Resistenz, Data-Exfiltration, PII-Leak-Test.'},
    {id:'in',  name:'Integration-Check',        desc:'MCP-Schnittstellen stabil, Dry-Run gegen sys_sap.'},
    {id:'rs',  name:'Risk-Scoring',             desc:'Reichweite × Reversibilität × Datenklasse × Geldwert → Stufe.'},
    {id:'au',  name:'Audit-Trail-Setup',        desc:'Hash-Chain initialisiert, Replay-fähig, 10 Jahre Retention.'},
  ];
  function runHarness(){
    setRunning(true); setResults(null); addLog('Harness-Test gestartet für Skill "'+name+'"','info');
    // Simuliere progressive Checks
    let step=0; const out={};
    const tick=()=>{
      if(step<harnessChecks.length){
        const c=harnessChecks[step];
        // Bewusst eine warnung in cp und sc bei höherem Risiko
        const ok = !(risk==='high' && (c.id==='cp' || c.id==='sc'));
        out[c.id]={ok, msg: ok ? 'PASS' : (c.id==='cp' ? 'WARN · Risk=high → Trust-Tier sollte ≤ T1' : 'WARN · Prompt-Injection-Tests bei high-risk verschärfen')};
        setResults({...out});
        step++; setTimeout(tick, 350);
      } else {
        setRunning(false);
        const failed = Object.values(out).filter(r=>!r.ok).length;
        addLog('Harness-Test abgeschlossen: '+(harnessChecks.length-failed)+'/'+harnessChecks.length+' bestanden', failed>0?'warn':'success');
      }
    };
    setTimeout(tick, 250);
  }
  return(
    <div className="sli" style={{display:'flex',height:'100%',padding:18,gap:14,overflow:'hidden'}}>
      <div style={{width:340,flexShrink:0,display:'flex',flexDirection:'column',borderRight:C.bd,paddingRight:14}}>
        <div style={{fontSize:12,fontWeight:900,color:C.tx,marginBottom:2}}>Skill-Creator</div>
        <div style={{fontSize:9,color:C.sub,marginBottom:14}}>Neuen Skill anlegen und live durch den AI Harness laufen lassen</div>
        <div className="sb" style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:10}}>
          <div>
            <label style={{fontSize:9,fontWeight:800,color:C.sub,textTransform:'uppercase',letterSpacing:1,display:'block',marginBottom:4}}>Skill-Name</label>
            <input value={name} onChange={e=>setName(e.target.value)} style={{width:'100%',padding:'8px 10px',background:'rgba(15,23,42,.6)',border:'1px solid #334155',borderRadius:7,color:C.tx,fontSize:11}}/>
          </div>
          <div>
            <label style={{fontSize:9,fontWeight:800,color:C.sub,textTransform:'uppercase',letterSpacing:1,display:'block',marginBottom:4}}>Beschreibung</label>
            <textarea value={desc} onChange={e=>setDesc(e.target.value)} rows={3} style={{width:'100%',padding:'8px 10px',background:'rgba(15,23,42,.6)',border:'1px solid #334155',borderRadius:7,color:C.tx,fontSize:11,resize:'vertical',fontFamily:'inherit'}}/>
          </div>
          <div>
            <label style={{fontSize:9,fontWeight:800,color:C.sub,textTransform:'uppercase',letterSpacing:1,display:'block',marginBottom:4}}>Wertschöpfungs-Phase</label>
            <select value={phase} onChange={e=>setPhase(e.target.value)} style={{width:'100%',padding:'8px 10px',background:'rgba(15,23,42,.6)',border:'1px solid #334155',borderRadius:7,color:C.tx,fontSize:11}}>
              <option value="rd">I — R&D</option>
              <option value="offer">II — Offer Engineering</option>
              <option value="order">III — Order Engineering</option>
              <option value="avor">IV — Arbeitsvorbereitung</option>
              <option value="mfg">V — Produktion/Logistik</option>
              <option value="sales">VI — Sales/Marketing</option>
              <option value="aftersales">VII — Aftersales</option>
              <option value="cross">Quer-Funktion</option>
            </select>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            <div>
              <label style={{fontSize:9,fontWeight:800,color:C.sub,textTransform:'uppercase',letterSpacing:1,display:'block',marginBottom:4}}>Risk</label>
              <select value={risk} onChange={e=>setRisk(e.target.value)} style={{width:'100%',padding:'8px 10px',background:'rgba(15,23,42,.6)',border:'1px solid #334155',borderRadius:7,color:C.tx,fontSize:11}}>
                <option value="low">low</option><option value="medium">medium</option><option value="high">high</option>
              </select>
            </div>
            <div>
              <label style={{fontSize:9,fontWeight:800,color:C.sub,textTransform:'uppercase',letterSpacing:1,display:'block',marginBottom:4}}>Trust-Tier (max)</label>
              <select value={trust} onChange={e=>setTrust(e.target.value)} style={{width:'100%',padding:'8px 10px',background:'rgba(15,23,42,.6)',border:'1px solid #334155',borderRadius:7,color:C.tx,fontSize:11}}>
                <option value="T0">T0 — intern</option><option value="T1">T1 — ungeprüft</option><option value="T2">T2 — Lieferant</option><option value="T3">T3 — öffentlich</option>
              </select>
            </div>
          </div>
          <button onClick={runHarness} disabled={running} className="btn-hover" style={{padding:'10px 14px',marginTop:10,borderRadius:8,background:running?'rgba(99,102,241,.08)':'linear-gradient(135deg,#6366f1,#4f46e5)',border:'none',color:'#fff',fontSize:11,fontWeight:800,cursor:running?'not-allowed':'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6,opacity:running?0.6:1}}>
            <i data-lucide={running?'loader-2':'play-circle'} className={running?'spin':''} style={{width:14,height:14}}></i>
            {running?'Harness-Test läuft …':'Durch Harness validieren'}
          </button>
        </div>
      </div>
      <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column'}}>
        <div style={{paddingBottom:10,borderBottom:C.bd,marginBottom:14}}>
          <div style={{fontSize:17,fontWeight:900,color:C.tx}}>AI Harness · Quality-Gate</div>
          <div style={{fontSize:11,color:C.sub,marginTop:2}}>Jeder Skill muss durch alle 6 Checks, bevor er produktiv geht</div>
        </div>
        <div className="sb" style={{flex:1,overflowY:'auto'}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:10}}>
            {harnessChecks.map(c=>{
              const r=results?.[c.id];
              const isRunning = running && !r;
              return(
                <div key={c.id} className="gc" style={{padding:13,position:'relative',borderColor:r ? (r.ok?'rgba(16,185,129,.4)':'rgba(245,158,11,.4)') : isRunning?'rgba(99,102,241,.4)':'rgba(255,255,255,.06)'}}>
                  <div style={{position:'absolute',top:0,left:0,width:3,height:'100%',background:r ? (r.ok?'#10b981':'#f59e0b') : isRunning?'#6366f1':'#334155'}}/>
                  <div style={{paddingLeft:9}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                      <div style={{fontSize:11,fontWeight:800,color:C.tx}}>{c.name}</div>
                      {r ? <span style={{fontSize:8,fontWeight:800,padding:'2px 7px',borderRadius:4,background:r.ok?'rgba(16,185,129,.15)':'rgba(245,158,11,.15)',color:r.ok?'#86efac':'#fcd34d'}}>{r.ok?'PASS':'WARN'}</span>
                          : isRunning ? <i data-lucide="loader-2" className="spin" style={{width:12,height:12,color:'#a5b4fc'}}></i>
                          : <span style={{fontSize:8,fontWeight:700,padding:'2px 7px',borderRadius:4,background:'rgba(100,116,139,.15)',color:C.sub}}>WAITING</span>}
                    </div>
                    <div style={{fontSize:10,color:'#94a3b8',lineHeight:1.5,marginBottom:r?6:0}}>{c.desc}</div>
                    {r && <div style={{fontSize:9,color:r.ok?'#86efac':'#fcd34d',fontFamily:'monospace',marginTop:3}}>→ {r.msg}</div>}
                  </div>
                </div>
              );
            })}
          </div>
          {results && Object.keys(results).length===harnessChecks.length && (
            <div className="gc" style={{padding:14,marginTop:14,borderColor:'rgba(99,102,241,.3)'}}>
              <div style={{fontSize:10,fontWeight:800,color:'#a5b4fc',textTransform:'uppercase',letterSpacing:1,marginBottom:8}}>Resultat</div>
              <div style={{fontSize:12,color:'#cbd5e1',lineHeight:1.7}}>
                {Object.values(results).every(r=>r.ok)
                  ? <>✓ Skill <strong>{name}</strong> hat alle 6 Harness-Checks bestanden und kann jetzt im Skill-Builder veröffentlicht werden.</>
                  : <>⚠ Skill <strong>{name}</strong> hat {Object.values(results).filter(r=>!r.ok).length} Warnung(en). Vor Veröffentlichung: Trust-Tier reduzieren oder Risiko-Klasse senken.</>}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   PROJECT SHELL — Container mit Nav + Header + View-Router + Event Stream
═══════════════════════════════════════════════════════════════ */
function ProjectShell({project, updateProject, onBackToProjects, enterpriseAgents, setEnterpriseAgents, enterprisePersons, enterpriseSkills, setEnterpriseSkills}){
  const role = ROLES.find(r=>r.id===project.roleId);
  const [activeViewId, setActiveViewId] = useState(project.views[0]||null);
  const [logs, setLogs] = useState([{time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}),text:'Projekt "'+project.name+'" geladen',type:'info'}]);
  const [showViewManager, setShowViewManager] = useState(false);
  const toast = useToast();

  // Lucide debounced
  useEffect(()=>{
    const raf = requestAnimationFrame(()=>{ if(window.lucide) window.lucide.createIcons(); });
    return ()=>cancelAnimationFrame(raf);
  });

  const addLog = useCallback((text, type='info')=>{
    const time = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    setLogs(p=>[{time,text,type},...p].slice(0,30));
    if(type==='success'||type==='error'||type==='warn') toast.push(text, type);
  },[toast]);

  // Wenn aktive View aus den Views entfernt wurde, automatisch auf die erste umschalten
  useEffect(()=>{
    if(activeViewId && !project.views.includes(activeViewId)){
      setActiveViewId(project.views[0]||null);
    }
  },[project.views, activeViewId]);

  // View-Router
  function renderView(){
    if(!activeViewId) return (
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12,color:C.sub}}>
        <div style={{fontSize:40}}>📋</div>
        <div style={{fontSize:14,fontWeight:700}}>Keine Sicht ausgewählt</div>
        <button onClick={()=>setShowViewManager(true)} className="btn-hover" style={{padding:'8px 16px',borderRadius:8,background:'rgba(99,102,241,.15)',border:'1px solid rgba(99,102,241,.3)',color:'#818cf8',fontSize:11,fontWeight:700,cursor:'pointer'}}>Reiter auswählen</button>
      </div>
    );
    const props = {project, updateProject, addLog};
    switch(activeViewId){
      case 'requirements':       return <RequirementsView {...props}/>;
      case 'rflp':               return <RFLPView {...props}/>;
      case 'product_bom':        return <ProductBOMView {...props}/>;
      case 'digital_twin':       return <DigitalTwinView {...props}/>;
      case 'pipeline':           return <PipelineView {...props}/>;
      case 'offer_calc':         return <OfferCalcView {...props}/>;
      case 'order_cfg':          return <OrderConfigView {...props}/>;
      case 'workplan':           return <WorkplanView {...props}/>;
      case 'mfg_floor':          return <MfgFloorView {...props}/>;
      case 'inventory':          return <InventoryView {...props}/>;
      case 'shipping':           return <ShippingView {...props}/>;
      case 'field_iiot':         return <FieldIIoTView {...props}/>;
      case 'service':            return <ServiceView {...props}/>;
      case 'cost_ctrl':          return <CostCtrlView {...props}/>;
      case 'governance':         return <GovernanceView {...props}/>;
      case 'digital_persons':    return <DigitalPersonsView {...props} enterprisePersons={enterprisePersons}/>;
      case 'agent_factory':      return <AgentFactoryView {...props} enterpriseAgents={enterpriseAgents} setEnterpriseAgents={setEnterpriseAgents}/>;
      case 'skills':             return <SkillsView {...props} enterpriseSkills={enterpriseSkills} setEnterpriseSkills={setEnterpriseSkills}/>;
      case 'orgchart':           return <OrgChartView {...props} enterprisePersons={enterprisePersons}/>;
      case 'business_processes': return <BusinessProcessesView {...props}/>;
      case 'mcp':                return <MCPView {...props}/>;
      // ── New v29 Views ──
      case 'harness':            return <HarnessView {...props}/>;
      case 'audit_trail':        return <AuditTrailView {...props}/>;
      case 'approval_inbox':     return <ApprovalInboxView {...props}/>;
      case 'risk_scoring':       return <RiskScoringView {...props}/>;
      case 'trust_tiers':        return <TrustTiersView {...props}/>;
      case 'cost_quota':         return <CostQuotaView {...props}/>;
      case 'quality_mgmt':       return <QualityMgmtView {...props}/>;
      case 'supplier':           return <SupplierView {...props}/>;
      case 'org_twin':           return <OrgTwinView {...props}/>;
      case 'digital_workforce':  return <DigitalWorkforceView {...props} enterpriseAgents={enterpriseAgents} enterprisePersons={enterprisePersons}/>;
      case 'knowledge_layer':    return <KnowledgeLayerView {...props}/>;
      case 'impact_trace':       return <ImpactTraceView {...props}/>;
      case 'skill_creator':      return <SkillCreatorView {...props} enterpriseSkills={enterpriseSkills} setEnterpriseSkills={setEnterpriseSkills}/>;
      default: return <div style={{padding:30,color:C.sub}}>Unbekannte Sicht: {activeViewId}</div>;
    }
  }

  // Aktive Views gruppieren (Projekt / Enterprise)
  const projectViews = project.views.filter(v => VIEW_CATALOG[v]?.kind==='project');
  const enterpriseViews = project.views.filter(v => VIEW_CATALOG[v]?.kind==='enterprise');

  return (
    <div style={{display:'flex',height:'100vh',width:'100%',overflow:'hidden'}}>
      {/* LEFT NAV */}
      <nav style={{width:225,background:'#020408',borderRight:C.bd,display:'flex',flexDirection:'column',padding:'14px 0',flexShrink:0}}>
        {/* Project Header */}
        <div style={{padding:'0 13px 12px',borderBottom:C.bd,marginBottom:10}}>
          <button onClick={onBackToProjects} className="btn-hover" style={{fontSize:9,color:'#64748b',background:'none',border:'none',cursor:'pointer',padding:0,marginBottom:8,display:'flex',alignItems:'center',gap:4}}>
            <i data-lucide="arrow-left" style={{width:10,height:10}}></i> Alle Projekte
          </button>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
            <div style={{width:30,height:30,borderRadius:7,background:(role?.color||'#64748b')+'22',border:'1.5px solid '+(role?.color||'#64748b')+'55',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <i data-lucide={role?.icon||'folder'} style={{width:14,height:14,color:role?.color}}></i>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:11,fontWeight:800,color:C.tx,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}} title={project.name}>{project.name}</div>
              <div style={{fontSize:8,color:role?.color,textTransform:'uppercase',letterSpacing:1,fontWeight:700,marginTop:1}}>{role?.label}</div>
            </div>
          </div>
        </div>

        {/* Tab-Liste */}
        <div className="sb" style={{flex:1,overflowY:'auto',padding:'0 9px'}}>

/* ═══════════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════════ */
function ViewManagerModal({project, onClose, onSave}){
  const [selViews, setSelViews] = useState(()=>{const s={};project.views.forEach(v=>{s[v]=true;});return s;});
  useEscape(onClose, true);
  function toggle(id){setSelViews(s=>({...s,[id]:!s[id]}));}
  const availableProject = Object.values(VIEW_CATALOG).filter(v=>v.kind==='project');
  const availableEnterprise = Object.values(VIEW_CATALOG).filter(v=>v.kind==='enterprise');
  const role = ROLES.find(r=>r.id===project.roleId);

  function reset(){
    const tmpl = ROLE_TEMPLATES[project.roleId]||{project:[],enterprise:[]};
    const s = {};
    [...tmpl.project,...tmpl.enterprise].forEach(v=>{s[v]=true;});
    setSelViews(s);
  }
  function save(){
    const views = Object.keys(selViews).filter(k=>selViews[k]);
    onSave(views);
  }

  return (
    <div style={{position:'fixed',inset:0,zIndex:200,background:'rgba(2,4,10,.85)',backdropFilter:'blur(8px)',display:'flex',alignItems:'center',justifyContent:'center',padding:30}}>
      <div className="scale-in glass" style={{width:'100%',maxWidth:820,maxHeight:'88vh',display:'flex',flexDirection:'column',borderRadius:16,border:'1px solid rgba(99,102,241,.25)',background:'linear-gradient(145deg,rgba(15,23,42,.95),rgba(5,8,15,.98))',boxShadow:'0 20px 80px rgba(0,0,0,.6)'}}>
        <div style={{padding:'16px 22px',borderBottom:'1px solid rgba(30,41,59,.6)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontSize:9,fontWeight:800,color:'#818cf8',textTransform:'uppercase',letterSpacing:2,marginBottom:3}}>Rolle · {role?.label}</div>
            <div style={{fontSize:16,fontWeight:900,color:C.tx}}>Reiter verwalten</div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <button onClick={reset} className="btn-hover" style={{padding:'6px 12px',borderRadius:7,background:'transparent',border:'1px solid '+(role?.color||'#334155')+'55',color:role?.color||'#94a3b8',fontSize:10,fontWeight:700,cursor:'pointer'}}>Auf Template zurücksetzen</button>
            <button onClick={onClose} style={{background:'none',border:'none',color:C.sub,cursor:'pointer',fontSize:22}}>×</button>
          </div>
        </div>
        <div className="sb fade" style={{flex:1,overflowY:'auto',padding:22}}>
          <Section title="Projekt-Sichten" actions={<div style={{fontSize:9,color:C.sub}}>{availableProject.filter(v=>selViews[v.id]).length}/{availableProject.length}</div>}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:8}}>
              {availableProject.map(v=>{const on=!!selViews[v.id];return(
                <div key={v.id} onClick={()=>toggle(v.id)} className={'gc btn-hover'+(on?' tile-on':'')} style={{padding:'9px 11px',cursor:'pointer',display:'flex',alignItems:'center',gap:8,borderColor:on?'#6366f1':'rgba(255,255,255,.06)'}}>
                  <div style={{padding:5,borderRadius:5,background:on?'rgba(99,102,241,.2)':'rgba(30,41,59,.5)'}}><i data-lucide={v.icon} style={{width:12,height:12,color:on?'#818cf8':'#64748b'}}></i></div>
                  <div style={{flex:1,fontSize:11,fontWeight:600,color:on?C.tx:'#94a3b8'}}>{v.label}</div>
                  <div className="checkmark" style={{border:'1.5px solid '+(on?'#6366f1':'#475569'),background:on?'#6366f1':'transparent'}}>{on&&<svg width="10" height="10" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round"/></svg>}</div>
                </div>
              );})}
            </div>

          <Section title="Enterprise-Bausteine" actions={<div style={{fontSize:9,color:C.sub}}>{availableEnterprise.filter(v=>selViews[v.id]).length}/{availableEnterprise.length}</div>}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:8}}>
              {availableEnterprise.map(v=>{const on=!!selViews[v.id];return(
                <div key={v.id} onClick={()=>toggle(v.id)} className={'gc btn-hover'+(on?' tile-on':'')} style={{padding:'9px 11px',cursor:'pointer',display:'flex',alignItems:'center',gap:8,borderColor:on?'#6366f1':'rgba(255,255,255,.06)'}}>

            <i data-lucide="check" style={{width:14,height:14}}></i> Übernehmen
          </button>
        </div>
      </div>
    </div>
  );
}

          enterpriseAgents={enterpriseAgents}
          setEnterpriseAgents={setEnterpriseAgents}
          enterprisePersons={enterprisePersons}
          enterpriseSkills={enterpriseSkills}
          setEnterpriseSkills={setEnterpriseSkills}
        />
      )}
      {showWizard && (
        <ProjectWizard
          existingProjects={projects}
          onCreate={createProject}
          onCancel={()=>setShowWizard(false)}
        />
      )}
    </>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(ToastProvider, null, React.createElement(App)));
} catch (err) {
  document.getElementById('root').innerHTML =
    '<div style="padding:32px;font-family:Inter,sans-serif;color:#f8fafc;max-width:680px;margin:40px auto">' +
    '<h2 style="color:#f87171;margin-bottom:12px">Render-Fehler</h2>' +
    '<p style="color:#94a3b8;line-height:1.6">Die Anwendung konnte nicht gestartet werden. Technische Meldung:</p>' +
    '<pre style="background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:14px;color:#fca5a5;white-space:pre-wrap;margin-top:10px">' +
    String(err && err.stack || err) + '</pre></div>';
}
</script>
</body>
</html>
