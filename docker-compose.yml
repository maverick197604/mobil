version: '3.8'

services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./frontend:/app/static
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      - UPLOAD_DIR=/app/uploads
      - STATIC_DIR=/app/static
    restart: unless-stopped
